<svg width="480" height="420" viewBox="0 0 480 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ntsAccent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6567f5"/>
      <stop offset="100%" stop-color="#4f52e8"/>
    </linearGradient>
    <linearGradient id="ntsBoxTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#eef0fb"/>
      <stop offset="100%" stop-color="#e2e5f7"/>
    </linearGradient>
    <linearGradient id="ntsBoxFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7f8fd"/>
      <stop offset="100%" stop-color="#eceefa"/>
    </linearGradient>
    <radialGradient id="ntsShadow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4f52e8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#4f52e8" stop-opacity="0"/>
    </radialGradient>
    <filter id="ntsSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#4f52e8" flood-opacity="0.14"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="240" cy="352" rx="150" ry="20" fill="url(#ntsShadow)"/>

  <!-- Decorative dashed orbit -->
  <circle cx="240" cy="190" r="128" fill="none" stroke="#d7daf3" stroke-width="2" stroke-dasharray="2 10" stroke-linecap="round"/>

  <!-- Floating dots / sparkle accents -->
  <circle cx="98" cy="110" r="6" fill="#e7e9fb"/>
  <circle cx="378" cy="130" r="4" fill="#c8cdf6"/>
  <circle cx="356" cy="266" r="5" fill="#e7e9fb"/>
  <g transform="translate(112,240)">
    <path d="M0 -9 L2.4 -2.4 9 0 2.4 2.4 0 9 -2.4 2.4 -9 0 -2.4 -2.4 Z" fill="#c8cdf6"/>
  </g>
  <g transform="translate(362,90)">
    <path d="M0 -7 L1.9 -1.9 7 0 1.9 1.9 0 7 -1.9 1.9 -7 0 -1.9 -1.9 Z" fill="#e7e9fb"/>
  </g>

  <!-- Open drawer / tray -->
  <g filter="url(#ntsSoft)">
    <path d="M118 222 L362 222 L392 300 L88 300 Z" fill="url(#ntsBoxFront)" stroke="#dcdfef" stroke-width="1.5"/>
    <path d="M88 300 L392 300 L392 320 C392 328.8 384.8 336 376 336 L104 336 C95.2 336 88 328.8 88 320 Z" fill="#e4e6f6" stroke="#d3d6ec" stroke-width="1.5"/>
    <!-- Slot -->
    <rect x="196" y="294" width="88" height="12" rx="6" fill="#c9cdf0"/>
  </g>

  <!-- Documents leaning inside the tray -->
  <g transform="translate(178,150) rotate(-8)">
    <rect x="0" y="0" width="86" height="108" rx="8" fill="#ffffff" stroke="#e2e5f7" stroke-width="1.5"/>
    <rect x="14" y="20" width="58" height="6" rx="3" fill="#dfe2f6"/>
    <rect x="14" y="34" width="42" height="6" rx="3" fill="#e9ebfa"/>
    <rect x="14" y="48" width="50" height="6" rx="3" fill="#e9ebfa"/>
  </g>
  <g transform="translate(232,146) rotate(6)">
    <rect x="0" y="0" width="86" height="108" rx="8" fill="#ffffff" stroke="#e2e5f7" stroke-width="1.5"/>
    <rect x="14" y="20" width="58" height="6" rx="3" fill="#dfe2f6"/>
    <rect x="14" y="34" width="42" height="6" rx="3" fill="#e9ebfa"/>
    <rect x="14" y="48" width="50" height="6" rx="3" fill="#e9ebfa"/>
  </g>

  <!-- Magnifying glass with a friendly "empty" mark -->
  <g transform="translate(240,196)">
    <circle r="40" fill="#ffffff" stroke="url(#ntsAccent)" stroke-width="6"/>
    <line x1="28" y1="28" x2="52" y2="52" stroke="url(#ntsAccent)" stroke-width="8" stroke-linecap="round"/>
    <line x1="-11" y1="-11" x2="11" y2="11" stroke="#c9cdf0" stroke-width="6" stroke-linecap="round"/>
    <line x1="11" y1="-11" x2="-11" y2="11" stroke="#c9cdf0" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
